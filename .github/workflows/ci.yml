name: Keeper Daemon CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/lazarusprotocol/keeper-daemon

permissions:
  contents: write
  packages: write

jobs:
  test-and-build:
    name: Keeper Daemon Tests, GHCR Package & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python syntax
        run: python -m compileall -q keeper common tests

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Package standalone Keeper Daemon distribution archive
        id: pkg_meta
        run: |
          tar -czf lazarus-keeper-daemon.tar.gz keeper common requirements.txt Dockerfile docker-compose.yml .env.example README.md LICENSE
          sha256_hash=$(sha256sum lazarus-keeper-daemon.tar.gz | awk '{print $1}')
          echo "${sha256_hash}  lazarus-keeper-daemon.tar.gz" > lazarus-keeper-daemon.tar.gz.sha256
          echo "sha256=${sha256_hash}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Keeper Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
          name: "Lazarus Keeper Node Daemon ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}"
          generate_release_notes: true
          body: |
            ### Lazarus Keeper Node Daemon (`${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}`)
            - **Container Image:** `ghcr.io/lazarusprotocol/keeper-daemon:${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}` (`ghcr.io/lazarusprotocol/keeper-daemon:latest`)
            - **Standalone Bundle:** `lazarus-keeper-daemon.tar.gz` (SHA-256: `${{ steps.pkg_meta.outputs.sha256 }}`)
            - **Quickstart:** `docker pull ghcr.io/lazarusprotocol/keeper-daemon:latest`
          files: |
            lazarus-keeper-daemon.tar.gz
            lazarus-keeper-daemon.tar.gz.sha256

